<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon</title>
<link rel="stylesheet" href="moon.css">
<style>
  /* Page styling only — not part of the component. Delete when pasting. */
  body{margin:0;min-height:100vh;background:#070a16;color:#cfd6e6;
       font:14px/1.6 ui-sans-serif,system-ui,sans-serif;
       display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:center;padding:5rem 2rem}
  figure{margin:0;width:300px;height:300px;display:grid;place-items:center;position:relative}
  figcaption{position:absolute;bottom:0;left:0;right:0;text-align:center;
       font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;opacity:.55}
</style>
</head>
<body>

<figure>
  <!-- ===== copy from here ===== -->
  <div class="moon moon--rising">
    <span class="moon__glow"></span>
    <span class="moon__halo"></span>
    <span class="moon__disc">
      <i></i><i></i><i></i><i></i><i></i>
    </span>
  </div>
  <!-- ===== to here. Swap the second class for moon--midnight or
       moon--setting. Add moon--cycle to loop all three, no JS. ===== -->
  <figcaption>moon--rising</figcaption>
</figure>

<figure>
  <div class="moon moon--midnight">
    <span class="moon__glow"></span>
    <span class="moon__halo"></span>
    <span class="moon__disc">
      <i></i><i></i><i></i><i></i><i></i>
    </span>
  </div>
  <figcaption>moon--midnight</figcaption>
</figure>

<figure>
  <div class="moon moon--setting">
    <span class="moon__glow"></span>
    <span class="moon__halo"></span>
    <span class="moon__disc">
      <i></i><i></i><i></i><i></i><i></i>
    </span>
  </div>
  <figcaption>moon--setting</figcaption>
</figure>

<figure>
  <div class="moon moon--cycle">
    <span class="moon__glow"></span>
    <span class="moon__halo"></span>
    <span class="moon__disc">
      <i></i><i></i><i></i><i></i><i></i>
    </span>
  </div>
  <figcaption>moon--cycle</figcaption>
</figure>

</body>
</html>
